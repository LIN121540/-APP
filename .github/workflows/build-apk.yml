name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 Java JDK（Android 构建依赖）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 整理网页文件到 www 目录
        run: |
          echo "=== 仓库根目录所有文件 ==="
          ls -la
          mkdir -p www
          rm -f www/index.html
          if [ -f index.html ]; then
            cp index.html www/index.html
            echo "已使用 index.html"
          elif [ -f phone.html ]; then
            cp phone.html www/index.html
            echo "已使用 phone.html"
          else
            HTML_FILE=$(find . -maxdepth 2 -name "*.html" -not -path "./www/*" -not -path "./.git/*" | head -1)
            if [ -n "$HTML_FILE" ]; then
              cp "$HTML_FILE" www/index.html
              echo "已使用 $HTML_FILE"
            fi
          fi
          echo "=== www 目录内容 ==="
          ls -la www
          if [ ! -f www/index.html ]; then
            echo "错误：www/index.html 不存在！"
            find . -not -path "./.git/*" -type f
            exit 1
          fi

      - name: 安装 Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: 添加 Android 平台
        run: npx cap add android

      - name: 同步 Capacitor
        run: npx cap sync android

      - name: 编译 Debug APK
        run: cd android && ./gradlew assembleDebug

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: RAINxDS-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
